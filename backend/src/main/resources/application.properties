server.port=${PORT:8080}
spring.application.name=scts-backend

# Database Configuration (H2 File / Memory mode with MySQL compatibility)
spring.datasource.url=${DB_URL:jdbc:h2:mem:sctsdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}

# JPA / Hibernate Naming & DDL Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
scts.app.jwtSecret=${JWT_SECRET:your_jwt_secret_key_change_in_production_environment_32chars}
scts.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id_placeholder.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_placeholder}

# File Upload Configuration
file.upload-dir=uploads/certificates
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
